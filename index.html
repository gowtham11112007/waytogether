<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <title>WayTogether</title>
    <!-- Apply the dark theme before the first paint (no white flash). Same rule as useDarkTheme(). -->
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('convoya.settings') || '{}') || {}).theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <meta name="description" content="Keep the Journey Together. A live map for group rides and road trips: see every friend, know who stopped or fell behind, and send an SOS in one hold." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WayTogether" />
    <!-- Link previews (WhatsApp, Telegram, X…) for shared invite links -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WayTogether" />
    <meta property="og:title" content="WayTogether: Keep the Journey Together" />
    <meta property="og:description" content="A live map for group rides and road trips. See every friend, know who stopped or fell behind, and send an SOS in one hold." />
    <meta property="og:url" content="https://waytogether-azure.vercel.app/" />
    <meta property="og:image" content="https://waytogether-azure.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WayTogether showing four friends on a live map" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
